<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Website - Widget Embedding Live Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <nav class="border-b border-slate-800 bg-slate-900/60 backdrop-blur px-8 py-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-white text-lg">Ac</div>
      <span class="font-semibold text-lg">Acme Enterprise Corp</span>
    </div>
    <div class="flex gap-6 text-sm text-slate-400">
      <a href="#" class="hover:text-white">Products</a>
      <a href="#" class="hover:text-white">Solutions</a>
      <a href="#" class="hover:text-white">Pricing</a>
      <a href="/" class="text-blue-400 hover:text-blue-300">← Return to SaaS Dashboard</a>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto py-20 px-6 text-center">
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-500/10 border border-blue-500/30 text-blue-400 text-xs font-semibold mb-6">
      <i class="fa-solid fa-code"></i> Live 1-Line Embeddable Widget Demo
    </div>
    <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-6 bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">
      Transform Customer Engagement with AI
    </h1>
    <p class="text-lg text-slate-400 max-w-2xl mx-auto mb-10">
      This page demonstrates how any website can embed your AI SaaS chatbot using a single `<script>` line. Look at the bottom-right corner!
    </p>

    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 text-left max-w-2xl mx-auto shadow-2xl">
      <div class="flex justify-between items-center mb-3">
        <span class="text-xs font-mono text-slate-400 uppercase">Embed Snippet</span>
        <span class="text-xs text-green-400 font-mono">Status: Connected</span>
      </div>
      <pre class="bg-slate-950 p-4 rounded-lg text-xs font-mono text-blue-300 overflow-x-auto"><code>&lt;script src="http://127.0.0.1:8000/static/widget.js" data-bot-id="acme_corp"&gt;&lt;/script&gt;</code></pre>
    </div>
  </main>

  <!-- Embed Widget Script -->
  <script src="/static/widget.js" data-bot-id="acme_corp"></script>
</body>
</html>
